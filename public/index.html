<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>CAT DEDUCTION</title><style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px}h1{letter-spacing:3px}.box{background:#1b2434;border:1px solid #334155;border-radius:16px;padding:14px;margin:10px 0}.row{display:flex;gap:8px;flex-wrap:wrap}input,button{font:inherit;padding:10px;border-radius:10px;border:1px solid #475569;background:#0f172a;color:#fff}button{cursor:pointer}.hide{display:none}#map{position:relative;height:420px;background:linear-gradient(90deg,#202938 1px,transparent 1px),linear-gradient(#202938 1px,transparent 1px);background-size:60px 60px;border:2px solid #475569;border-radius:16px;overflow:hidden}.cat{position:absolute;width:38px;height:34px;border-radius:45% 45% 42% 42%;transform:translate(-50%,-50%);border:2px solid #fff;box-shadow:0 3px 8px #0008}.cat:before,.cat:after{content:"";position:absolute;top:-9px;width:15px;height:15px;background:inherit;border-top:2px solid #fff;transform:rotate(45deg)}.cat:before{left:2px}.cat:after{right:2px}.eye{position:absolute;width:5px;height:5px;border-radius:50%;background:#111;top:12px;left:9px;box-shadow:14px 0 #111}.task{position:absolute;width:48px;height:48px;border:2px dashed #94a3b8;border-radius:10px;display:grid;place-items:center;font-size:21px}.red{background:#ef4444}.blue{background:#3b82f6}.green{background:#22c55e}.yellow{background:#eab308}.purple{background:#a855f7}.pink{background:#ec4899}.cyan{background:#06b6d4}.orange{background:#f97316}.meeting{padding:12px;background:#2a1f2d;border-radius:12px}.vote{margin:4px}.small{color:#aeb8c8;font-size:13px}</style></head><body><main>
<h1>🐱 CAT DEDUCTION</h1><div class="small">색깔 고양이들 사이에 배신자 한 마리가 숨어 있다.</div>
<div id="lobby" class="box"><div class="row"><input id="name" placeholder="고양이 이름"><input id="room" placeholder="방 코드"><button id="join">입장</button></div><p id="status">친구와 같은 방 코드를 사용하세요.</p><div id="list"></div><button id="start" class="hide">게임 시작</button></div>
<div id="gamebox" class="box hide"><div class="row"><b id="task">미션 0/4</b><span id="state">탐색 중</span></div><div id="map"><div class="task" style="left:15%;top:25%">🔧</div><div class="task" style="left:52%;top:22%">⚙️</div><div class="task" style="left:80%;top:72%">💡</div><div class="task" style="left:20%;top:76%">🧪</div></div><div class="row" style="margin-top:10px"><button id="u">↑</button><button id="l">←</button><button id="d">↓</button><button id="r">→</button><button id="do">미션</button><button id="report">🚨 신고</button></div><div id="meeting" class="meeting hide"><b>🚨 회의</b><p>누가 배신자인지 투표하세요.</p><div id="votes"></div></div><p id="log" class="small"></p></div>
<script>
let ws,id,room,host=false,me,players={};
const $=x=>document.querySelector(x);
$("#join").onclick=()=>{room=$("#room").value.trim().toUpperCase();if(!room)return;ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host);ws.onopen=()=>ws.send(JSON.stringify({type:"join",room,name:$("#name").value.trim()||"Cat"}));ws.onmessage=e=>handle(JSON.parse(e.data))};
function handle(m){if(m.type==="error")return $("#status").textContent=m.message;if(m.type==="joined"){id=m.id;host=m.host;$("#status").textContent="ROOM "+m.room+" 입장 완료";if(host)$("#start").classList.remove("hide")}if(m.type==="players"){players=Object.fromEntries(m.players.map(p=>[p.id,p]));render()}if(m.type==="started"){$("#lobby").classList.add("hide");$("#gamebox").classList.remove("hide");players=Object.fromEntries(m.players.map(p=>[p.id,p]));render()}if(m.type==="meeting"){$("#meeting").classList.remove("hide");votes()}if(m.type==="result"){$("#log").textContent=m.name?(m.name+" 퇴장 — "+(m.correct?"배신자였음!":"시민 고양이였음!")):"투표 무효";if(m.win)$("#log").textContent+="  🏆 "+(m.win==="crew"?"고양이 팀 승리!":"배신자 승리!");$("#meeting").classList.add("hide")}}
function render(){ $("#list").textContent="참가자: "+Object.values(players).map(p=>p.name).join(" · ");document.querySelectorAll(".cat").forEach(x=>x.remove());for(const p of Object.values(players)){let e=document.createElement("div");e.className="cat "+p.color;e.style.left=p.x/720*100+"%";e.style.top=p.y/480*100+"%";e.title=p.name;let eye=document.createElement("i");eye.className="eye";e.append(eye);$("#map").append(e)}let p=players[id];if(p)$("#task").textContent="미션 "+p.tasks+"/4"}
function move(dx,dy){let p=players[id];if(!p||!ws)return;p.x=Math.max(20,Math.min(700,p.x+dx));p.y=Math.max(80,Math.min(440,p.y+dy));ws.send(JSON.stringify({type:"move",x:p.x,y:p.y}))}
$("#start").onclick=()=>ws.send(JSON.stringify({type:"start"}));$("#do").onclick=()=>ws.send(JSON.stringify({type:"task"}));$("#report").onclick=()=>ws.send(JSON.stringify({type:"report"}));$("#u").onclick=()=>move(0,-18);$("#d").onclick=()=>move(0,18);$("#l").onclick=()=>move(-18,0);$("#r").onclick=()=>move(18,0);
document.addEventListener("keydown",e=>{if(e.key==="ArrowUp"||e.key==="w")move(0,-18);if(e.key==="ArrowDown"||e.key==="s")move(0,18);if(e.key==="ArrowLeft"||e.key==="a")move(-18,0);if(e.key==="ArrowRight"||e.key==="d")move(18,0)});
function votes(){let box=$("#votes");box.innerHTML="";for(let p of Object.values(players)){let b=document.createElement("button");b.className="vote";b.textContent=p.name;b.onclick=()=>{ws.send(JSON.stringify({type:"vote",target:p.id}));b.disabled=true};box.append(b)}let s=document.createElement("button");s.className="vote";s.textContent="SKIP";s.onclick=()=>{ws.send(JSON.stringify({type:"vote",target:"skip"}));s.disabled=true};box.append(s)}
</script></main></body></html>
